    <script>
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var WrappedWebSocket = function (url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isViteHmr) {
              var dummy = new EventTarget();
              dummy.url = String(url || '');
              dummy.readyState = 1;
              dummy.protocol = 'vite-hmr';
              dummy.extensions = '';
              dummy.bufferedAmount = 0;
              dummy.binaryType = 'blob';
              dummy.send = function () {};
              dummy.close = function () {
                dummy.readyState = 3;
              };
              setTimeout(function () {
                try {
                  var ev = new Event('open');
                  dummy.dispatchEvent(ev);
                  if (typeof dummy.onopen === 'function') dummy.onopen(ev);
                } catch (e) {}
              }, 0);
              return dummy;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          WrappedWebSocket.prototype = NativeWebSocket.prototype;
          WrappedWebSocket.CONNECTING = 0;
          WrappedWebSocket.OPEN = 1;
          WrappedWebSocket.CLOSING = 2;
          WrappedWebSocket.CLOSED = 3;
          window.WebSocket = WrappedWebSocket;
        }
        window.addEventListener('error', function (event) {
          if (
            event &&
            (event.message === 'ResizeObserver loop completed with undelivered notifications.' ||
              event.message === 'ResizeObserver loop limit exceeded' ||
              (typeof event.message === 'string' &&
                event.message.indexOf('ResizeObserver') !== -1))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        });
        window.addEventListener('unhandledrejection', function (event) {
          if (
            event &&
            event.reason &&
            typeof event.reason.message === 'string' &&
            (event.reason.message.indexOf('WebSocket') !== -1 ||
              event.reason.message.indexOf('vite') !== -1)
          ) {
            event.preventDefault();
          }
        });
      })();
    </script>
